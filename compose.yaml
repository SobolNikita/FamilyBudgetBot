name: family-expenses

x-app: &app
  image: family-expenses:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://db:5432/${POSTGRES_DB:-family_expenses}?sslmode=disable
    PGUSER: ${POSTGRES_USER:-family}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    HTTP_ADDR: :8080
    WEB_DIR: /app/web/dist

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_expenses}
      POSTGRES_USER: ${POSTGRES_USER:-family}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["./migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    stop_grace_period: 25s
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
