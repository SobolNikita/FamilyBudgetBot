<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#245c47" />
    <script>
      try {
        const theme = localStorage.getItem('family-budget-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#141c18'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta name="description" content="Общие расходы семьи в одном месте" />
    <title>Семейный бюджет</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
